<form action="">
<fieldset>
    <legend>Login details</legend>
    <br>
    <label for="name">Name:</label>
    <br>
    <input type="text" name="name" id="name">
    <br>
    <label for="email">Email:</label>
    <br>
    <input type="email" name="email" id="email">
    <br>
    <label for="password">Password:</label>
    <br>
    <input type="password" name="password" id="password">
</fieldset>
<br>
<fieldset>
    <legend>Your feedback</legend>
    <p>Please check all the emotions that apply to your:</p>
    
    <label for="Angry">Angry</label>
    <input type="checkbox" name="emotions" id="Angry">
    <br>
    <label for="sad">Sad</label>
    <input type="checkbox" name="emotions" id="sad">
    <br>
    <label for="happy">Happy</label>
    <input type="checkbox" name="emotions" id="happy">
    <br>
    <label for="ambivalent">Ambivalent</label>
    <input type="checkbox" name="emotions" id="ambivalent">
    <br>
    <p>How satisfied were you with our service?</p>
    <label for="very satisfied">Very satisfied</label>
    <input type="radio" name="satisfied" id="very satisfied">
</fieldset>




</form>
