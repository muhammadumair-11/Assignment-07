<form action="">
<fieldset>
<legend>Login</legend>
<label for="Username">Username*</label><br>
<input type="text" name="Username" id="Username"><br>
<label for="password">Password*</label><br>
<input type="password" name="password" id="password">
</fieldset>
<fieldset>
<legend>Gender*</legend>
<input type="radio" name="Gender" id="Male">
<label for="Male">Male</label>
<input type="radio" name="Gender" id="Female">
<label for="Female">Female</label>
</fieldset>
<fieldset>
<legend>Programming Skill*</legend>
<input type="checkbox" name="Skill" id="java">
<label for="java">Java</label>
<input type="checkbox" name="Skill" id="C++">
<label for="C++">C++</label>
<input type="checkbox" name="Skill" id="C#">
<label for="C#">C#</label>
</fieldset>
<fieldset>
<legend>Fruit</legend>
<label for="Fruit">Choose a fruit:</label>
<select name="fruit" id="fruit">
<option value="Banana">Banana</option>
<option value="Mangeo">Mangeo</option>
<option value="Apple">Apple</option>
<option value="Orange">Orange</option>
</select>
</fieldset><br>
<textarea name="comment" id="comment" rows="10" cols="100"  placeholder="Enter your comment here"></textarea>
<br>
<button type="submit">SEND</button>
<button type="reset">RESET</button>
</form>
</body>
</html>
