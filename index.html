<h1>User Registration Form</h1>
<br>
<form action="">
    <fieldset>
<legend>Personal Information</legend>
<label for="name">Name:</label>
<input type="text" name="name" id="name">
<br><br>
<label for="email ">Email Address:</label>
<input type="email" name="email" id="email ">
<br><br>
<label for="password">Password:</label>
<input type="password" name="password" id="password">
<br><br>
<label for="confirm_password">Confirm Password</label>
<input type="confirm_password" name="confirm_password" id="confirm_password">
<br><br>
    </fieldset>
</form>
<br>
<fieldset>
<legend>Address Details</legend>
<label for="Address_line_one">Address Line One:</label>
<input type="text" name="Address_line_one" id="Address_line_one">
<br><br>
<label for="Address_line_two">Address Line Two:</label>
<input type="text" name="Address_line_two" id="Address_line_two">
<br><br>
<label for="town_city">Town / City</label>
<input type="text" name="town_city" id="town_city"><br><br>
<label for="zip">Zip / Post Code:</label>
<input type="text" name="zip" id="zip">
<br>
</fieldset>
<br>
<button type="submit">Sign In</button>
</body>
</html>
